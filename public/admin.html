<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন লগইন</title>
    <style>
        body { font-family: sans-serif; background-color: #222f3e; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background-color: #334455; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); width: 300px; text-align: center; }
        h2 { margin-bottom: 20px; color: #ff6b6b; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-size: 14px; }
        input { width: 100%; padding: 10px; border: none; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: #219150; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>অ্যাডমিন লগইন</h2>
        <div class="form-group">
            <label for="username">ইউজারনেম</label>
            <input type="text" id="username">
        </div>
        <div class="form-group">
            <label for="password">পাসওয়ার্ড</label>
            <input type="password" id="password">
        </div>
        <button id="login-btn">লগইন</button>
    </div>

    <script>
        document.getElementById('login-btn').addEventListener('click', async () => {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(`${window.location.origin}/api/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'লগইন ব্যর্থ হয়েছে');

                localStorage.setItem('shopeasy-token', data.token);
                alert('লগইন সফল হয়েছে!');
                window.location.href = '/dashboard.html';
            } catch (err) {
                alert('ত্রুটি: ' + err.message);
            }
        });
    </script>
</body>
</html>
