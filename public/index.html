<body>
    <header>

        <div class="header-actions">
            <button class="cart-btn" id="headerCartBtn" onclick="openCartDrawer()" aria-label="Open cart">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="cart-count" id="cartCount">0</span>
            </button>
        </div>
    </header>

    <div class="hero">
        <h1>আমাদের চমৎকার কালেকশন</h1>
        <p>ডিটেইলস ও অর্ডার করতে প্রডাক্টের ওপর টাচ করুন</p>
    </div>

    <div class="container">
        <div class="category-bar" id="categoryBar">
            <button class="cat-btn active" onclick="filterProducts('all', this)">সকল প্রডাক্ট</button>
            <button class="cat-btn" onclick="filterProducts('electronics', this)">ইলেকট্রনিক্স</button>
            <button class="cat-btn" onclick="filterProducts('fashion', this)">ফ্যাশন</button>
        </div>
        <div id="statusBox" class="status-box"></div>
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <div class="modal" id="productViewModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('productViewModal')">&times;</span>
            <img id="viewImage" src="" class="view-img">
            <h2 id="viewTitle" class="view-title"></h2>
            <div id="viewPrice" class="view-price"></div>
            <div class="view-desc" id="viewDesc"></div>
            <div class="option-group">
                <label>কালার / ভ্যারাইটি সিলেক্ট করুন:</label>
                <select id="viewVariety"></select>
            </div>
            <div class="qty-box">
                <button class="qty-btn" onclick="changeQty(-1)">-</button>
                <div class="qty-val" id="qtyValue">1</div>
                <button class="qty-btn" onclick="changeQty(1)">+</button>
            </div>
            <div class="form-group">
                <label>নাম</label>
                <input id="customerName" type="text" placeholder="আপনার নাম">

            <div class="form-group">
                <label>ফোন</label>
                <input id="customerPhone" type="text" placeholder="ফোন নাম্বার">
            </div>
            <div class="form-group">
                <label>ঠিকানা</label>
                <textarea id="customerAddress" rows="3" placeholder="সম্পূর্ণ ঠিকানা"></textarea>
            </div>
            <button class="action-btn" onclick="submitOrder()">অর্ডার করুন</button>
        </div>
    </div>

    <div class="modal" id="adminModal">
        <div class="modal-content admin-modal-wide">
            <span class="close-btn" onclick="closeModal('adminModal')">&times;</span>
            <div class="admin-tabs">
                <button class="admin-tab-btn active" onclick="switchAdminTab('login')">Login</button>
                <button class="admin-tab-btn" onclick="switchAdminTab('orders')">Orders</button>
            </div>

            <div id="adminLoginTab" class="tab-content active">
                <div class="form-group">
                    <label>Username</label>
                    <input id="adminUsername" type="text" placeholder="admin">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input id="adminPassword" type="password" placeholder="Password">
                </div>
                <button class="submit-btn" onclick="adminLogin()">Login</button>

            <div id="adminOrdersTab" class="tab-content">
                <div class="orders-list" id="ordersList"></div>

    <div class="cart-drawer" id="cartDrawer">
        <div style="padding: 20px; display:flex; flex-direction:column; height:100%;">
            <div class="cart-header">
                <h3>আপনার কার্ট</h3>
                <button class="close-btn" onclick="closeCartDrawer()" style="position: static; font-size: 24px;">&times;</button>
            </div>
            <div class="cart-items" id="cartItems"></div>
            <div class="cart-total" id="cartTotal">মোট: ৳0</div>
            <button class="submit-btn" onclick="checkoutCart()" style="margin-top: 12px;">চেকআউট</button>
        </div>
    </div>

    <footer>
        <div>© 2026 ShopEasy</div>
        <button class="admin-footer-btn" onclick="openAdminModal()">Admin Panel</button>
    </footer>

    <script>
        const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
            ? 'http://localhost:4000'
            : window.location.origin;

        const state = {
            products: [],
            filtered: [],
            currentCategory: 'all',
            selectedProduct: null,
            quantity: 1,
            cart: JSON.parse(localStorage.getItem('shopeasy-cart') || '[]')
        };

        function showStatus(message, type = 'info') {
            const box = document.getElementById('statusBox');
            box.textContent = message;
            box.className = 'status-box ' + (type === 'error' ? 'error' : type === 'success' ? 'success' : '');
            box.style.display = 'block';
        }

        function hideStatus() {
            const box = document.getElementById('statusBox');
            box.style.display = 'none';
        }

        function openCartDrawer() {
            renderCart();
            document.getElementById('cartDrawer').classList.add('open');
        }

        function closeCartDrawer() {
            document.getElementById('cartDrawer').classList.remove('open');
        }

        async function fetchProducts() {
            try {
                const res = await fetch(`${API_BASE}/api/products`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                state.products = Array.isArray(data) ? data : [];
                filterProducts(state.currentCategory);
                showStatus('Products loaded successfully.', 'success');
            } catch (error) {
                console.error('Product fetch failed:', error);
                showStatus('Products could not be loaded. Check backend URL and server status.', 'error');
            }
        }

        function filterProducts(category, button) {
            state.currentCategory = category;
            const buttons = document.querySelectorAll('.cat-btn');
            buttons.forEach(btn => btn.classList.toggle('active', btn === button || (button === undefined && btn.textContent.includes(category === 'all' ? 'সকল' : category === 'electronics' ? 'ইলেকট্রনিক্স' : 'ফ্যাশন'))));

            state.filtered = category === 'all'
                ? state.products
                : state.products.filter(item => String(item.category || '').toLowerCase() === category.toLowerCase());

            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            if (!state.filtered.length) {
                grid.innerHTML = '<div style="padding:20px; background:#fff; border-radius:12px; color:#666;">No products available.</div>';
                return;
            }

            grid.innerHTML = state.filtered.map(product => `
                <div class="product-card" onclick="openProductModal(${product.id})">
                    <img class="product-img" src="${product.image || 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=900&q=80'}" alt="${product.title}">
                    <div class="product-title">${product.title}</div>
                    <div class="product-price">৳ ${product.price}</div>
                    <button class="add-cart-small" onclick="event.stopPropagation(); addToCart(${product.id})">কার্টে যোগ</button>
                </div>
            `).join('');
        }

        function openProductModal(productId) {
            const product = state.products.find(item => item.id === Number(productId));
            if (!product) return;
            state.selectedProduct = product;
            state.quantity = 1;
            document.getElementById('viewTitle').textContent = product.title;
            document.getElementById('viewPrice').textContent = '৳ ' + product.price;
            document.getElementById('viewDesc').textContent = product.desc || 'No description available.';
            document.getElementById('viewImage').src = product.image || 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=900&q=80';
            const varietySelect = document.getElementById('viewVariety');
            const options = (product.varieties || 'Default').split(',').map(v => v.trim()).filter(Boolean);
            varietySelect.innerHTML = options.map(v => `<option value="${v}">${v}</option>`).join('');
            document.getElementById('qtyValue').textContent = state.quantity;
            document.getElementById('productViewModal').style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function changeQty(delta) {
            state.quantity = Math.max(1, state.quantity + delta);
            document.getElementById('qtyValue').textContent = state.quantity;
        }

        function addToCart(productId) {
            const product = state.products.find(item => item.id === Number(productId));
            if (!product) return;
            const existing = state.cart.find(item => item.id === product.id);
            if (existing) existing.qty += 1;
            else state.cart.push({ ...product, qty: 1 });
            localStorage.setItem('shopeasy-cart', JSON.stringify(state.cart));
            renderCart();
            openCartDrawer();
            showStatus('Product added to cart.', 'success');
        }

        function renderCart() {
            const cartItems = document.getElementById('cartItems');
            if (!state.cart.length) {
                cartItems.innerHTML = '<div class="cart-empty">কার্ট খালি</div>';
                document.getElementById('cartTotal').textContent = 'মোট: ৳0';
                return;
            }

            let total = 0;
            cartItems.innerHTML = state.cart.map(item => {
                const lineTotal = Number(item.price || 0) * Number(item.qty || 1);
                total += lineTotal;
                return `
                    <div class="cart-item">
                        <img src="${item.image || 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=900&q=80'}" alt="${item.title}">
                        <div class="cart-item-info">
                            <div class="cart-item-title">${item.title}</div>
                            <div class="cart-item-controls">
                                <button class="qty-btn" onclick="updateCartQty(${item.id}, -1)">-</button>
                                <span>${item.qty}</span>
                                <button class="qty-btn" onclick="updateCartQty(${item.id}, 1)">+</button>
                            </div>
                        </div>
                        <div style="font-weight:700;">৳${lineTotal}</div>
                    </div>
                `;
            }).join('');

            document.getElementById('cartTotal').textContent = 'মোট: ৳' + total;
        }

        function updateCartQty(productId, delta) {
            const item = state.cart.find(p => p.id === Number(productId));
            if (!item) return;
            item.qty += delta;
            if (item.qty <= 0) state.cart = state.cart.filter(p => p.id !== Number(productId));
            localStorage.setItem('shopeasy-cart', JSON.stringify(state.cart));
            renderCart();
        }

        function submitOrder() {
            if (!state.selectedProduct) return;
            const name = document.getElementById('customerName').value.trim();
            const phone = document.getElementById('customerPhone').value.trim();
            const address = document.getElementById('customerAddress').value.trim();
            const selectedVariety = document.getElementById('viewVariety').value;

            if (!name || !phone || !address) {
                showStatus('Please fill name, phone and address before placing order.', 'error');
                return;
            }

            const payload = {
                product: state.selectedProduct.title,
                price: state.selectedProduct.price,
                name,
                phone,
                address,
                method: 'Cash on Delivery',
                txnid: selectedVariety,
                qty: state.quantity
            };

            fetch(`${API_BASE}/api/orders`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(async (res) => {
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.errors ? JSON.stringify(data.errors) : 'Order failed');
                closeModal('productViewModal');
                showStatus('Order placed successfully.', 'success');
            })
            .catch((error) => {
                console.error('Order submit failed:', error);
                showStatus('Order could not be placed. Check backend and form values.', 'error');
            });
        }

        function checkoutCart() {
            if (!state.cart.length) {
                showStatus('Cart is empty.', 'error');
                return;
            }

            const items = state.cart.map(item => `${item.title} (${item.qty})`).join(', ');
            showStatus(`Cart checkout ready: ${items}`, 'success');
            closeCartDrawer();
        }

        async function adminLogin() {
            const username = document.getElementById('adminUsername').value.trim();
            const password = document.getElementById('adminPassword').value.trim();
            if (!username || !password) {
                showStatus('Username and password are required.', 'error');
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/api/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.error || 'Login failed');
                localStorage.setItem('shopeasy-admin-token', data.token);
                showStatus('Login successful.', 'success');
                loadAdminOrders();
            } catch (error) {
                console.error('Admin login failed:', error);
                showStatus('Admin login failed. Check backend and credentials.', 'error');
            }
        }

        async function loadAdminOrders() {
            const token = localStorage.getItem('shopeasy-admin-token');
            if (!token) return;
            try {
                const res = await fetch(`${API_BASE}/api/admin/orders`, {
                    headers: { Authorization: `Bearer ${token}` }
                });
                const data = await res.json().catch(() => []);
                if (!res.ok) throw new Error('Unauthorized');
                const ordersList = document.getElementById('ordersList');
                if (!Array.isArray(data) || !data.length) {
                    ordersList.innerHTML = '<div class="order-card">No orders yet.</div>';
                    return;
                }
                ordersList.innerHTML = data.map(order => `
                    <div class="order-card">
                        <div class="order-header">
                            <strong>#${order.id}</strong>
                            <span class="order-price">৳ ${order.price || 0}</span>
                        </div>
                        <div class="order-body">
                            <p><strong>Product:</strong> ${order.product || 'N/A'}</p>
                            <p><strong>Name:</strong> ${order.customer_name || 'N/A'}</p>
                            <p><strong>Phone:</strong> ${order.phone || 'N/A'}</p>
                            <p><strong>Address:</strong> ${order.address || 'N/A'}</p>
                            <p><strong>Method:</strong> ${order.payment_method || 'N/A'}</p>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Load admin orders failed:', error);
                showStatus('Could not load admin orders. Please login again.', 'error');
            }
        }

        function openAdminModal() {
            document.getElementById('adminModal').style.display = 'flex';
            loadAdminOrders();
        }

        function switchAdminTab(tabName) {
            document.querySelectorAll('.admin-tab-btn').forEach(btn => btn.classList.toggle('active', btn.textContent.toLowerCase() === tabName));
            const loginTab = document.getElementById('adminLoginTab');
            const ordersTab = document.getElementById('adminOrdersTab');
            loginTab.classList.toggle('active', tabName === 'login');
            ordersTab.classList.toggle('active', tabName === 'orders');
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchProducts();
            renderCart();
            showStatus('Connecting to backend...', 'info');
        });
    </script>
</body>
</html>
