<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন ড্যাশবোর্ড</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; margin: 0; display: flex; }
        .sidebar { width: 250px; background-color: #2c3e50; color: #fff; height: 100vh; padding: 20px; box-sizing: border-box; }
        .sidebar h2 { color: #ff6b6b; font-size: 20px; margin-bottom: 20px; }
        .sidebar a { display: block; color: #bdc3c7; padding: 10px 0; text-decoration: none; border-bottom: 1px solid #34495e; }
        .sidebar a:hover { color: #fff; }
        .main-content { flex: 1; padding: 20px; }
        .card { background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>অ্যাডমিন প্যানেল</h2>
        <a href="#">অর্ডার তালিকা</a>
        <a href="#">প্রডাক্ট ম্যানেজমেন্ট</a>
        <a href="#">লগ আউট</a>
    </div>
    <div class="main-content">
        <div class="card">
            <h1>স্বাগতম, অ্যাডমিন</h1>
            <p>এখান থেকে আপনি আপনার অর্ডার এবং প্রডাক্টগুলো পরিচালনা করতে পারবেন।</p>
        </div>
    </div>
</body>
</html>
