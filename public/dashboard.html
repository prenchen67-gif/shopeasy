<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন ড্যাশবোর্ড</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; display: flex; }
        .sidebar { width: 250px; background-color: #2c3e50; color: #fff; height: 100vh; padding: 20px; box-sizing: border-box; position: fixed; }
        .sidebar h2 { color: #ff6b6b; font-size: 20px; margin-bottom: 20px; }
        .sidebar a { display: block; color: #bdc3c7; padding: 10px 0; text-decoration: none; border-bottom: 1px solid #34495e; cursor: pointer; transition: 0.3s; }
        .sidebar a:hover, .sidebar a.active { color: #fff; padding-left: 5px; font-weight: bold; }
        .main-content { margin-left: 250px; flex: 1; padding: 30px; }
        .card { background-color: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 30px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        .btn { background-color: #27ae60; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; }
        .btn:hover { background-color: #219150; }
        .checkbox-group { display: flex; gap: 15px; margin-top: 5px; }
        .checkbox-group label { font-weight: normal; cursor: pointer; }
        
        /* টেবিল স্টাইল (অর্ডার লিস্টের জন্য) */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f8f9fa; color: #333; }

        /* সেকশন শো/হাইড করার ক্লাস */
        .admin-section { display: none; }
    </style>
</head>
<body>

    <!-- সাইডবার -->
    <div class="sidebar">
        <h2>অ্যাডমিন প্যানেল</h2>
        <a href="#" id="menu-orders" onclick="switchSection('orders', event)">অর্ডার তালিকা</a>
        <a href="#" id="menu-products" onclick="switchSection('products', event)">প্রোডাক্ট যোগ করুন</a>
        <a href="/admin.html">লগ আউট</a>
    </div>

    <!-- মেইন কন্টেন্ট -->
    <div class="main-content">
        
        <!-- ১. অর্ডার তালিকা সেকশন -->
        <div class="card admin-section" id="orders-section">
            <h2>গ্রাহকদের অর্ডার তালিকা</h2>
            <table>
                <thead>
                    <tr>
                        <th>অর্ডার আইডি</th>
                        <th>গ্রাহকের নাম</th>
                        <th>প্রোডাক্ট</th>
                        <th>মূল্য</th>
                        <th>সাইজ</th>
                        <th>এড্রেস (Address)</th>
                        <th>TXNID</th>
                        <th>PHONE NUMBER</th>
                        <th>স্ট্যাটাস</th>
                    </tr>
                </thead>
                <tbody id="orderTableBody">
                    <tr>
                        <td colspan="9" style="text-align: center; color: #777;">লোড হচ্ছে...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- ২. প্রোডাক্ট যোগ করার ফর্ম সেকশন -->
        <div class="card admin-section" id="add-product">
            <h2>নতুন প্রোডাক্ট যোগ করুন</h2>
            <form id="productForm">
                
                <div class="form-group">
                    <label for="title">প্রোডাক্টের নাম</label>
                    <input type="text" id="title" required placeholder="যেমন: টি-শার্ট">
                </div>

                <!-- ক্যাটাগরি সিলেক্ট -->
                <div class="form-group">
                    <label for="productCategory">ক্যাটাগরি</label>
                    <select id="productCategory" required onchange="toggleSizeOption()">
                        <option value="">ক্যাটাগরি সিলেক্ট করুন</option>
                        <option value="Fashion">Fashion</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Gadgets">Gadgets</option>
                    </select>
                </div>

                <!-- ডাইনামিক সাইজ (Fashion সিলেক্ট করলেই দেখাবে) -->
                <div class="form-group" id="sizeGroup" style="display: none;">
                    <label>সাইজ সিলেক্ট করুন (Fashion Category-র জন্য)</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="sizes" value="S"> S</label>
                        <label><input type="checkbox" name="sizes" value="M"> M</label>
                        <label><input type="checkbox" name="sizes" value="L"> L</label>
                        <label><input type="checkbox" name="sizes" value="XL"> XL</label>
                        <label><input type="checkbox" name="sizes" value="XXL"> XXL</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="price">মূল্য (টাকা)</label>
                    <input type="number" id="price" required placeholder="যেমন: ৫০০">
                </div>

                <div class="form-group">
                    <label for="image">ছবি (Image URL)</label>
                    <input type="url" id="image" required placeholder="https://example.com/image.jpg">
                </div>

                <div class="form-group">
                    <label for="desc">বিবরণ</label>
                    <textarea id="desc" rows="4" placeholder="প্রোডাক্টের বিস্তারিত তথ্য..."></textarea>
                </div>

                <button type="submit" class="btn">প্রোডাক্ট সেভ করুন</button>
            </form>
        </div>

    </div>

    <script>
        // সেকশন সুইচ করার লজিক
        function switchSection(sectionId, event) {
            if (event) event.preventDefault();

            // দুইটা সেকশনই বন্ধ করে দেওয়া
            document.getElementById('orders-section').style.display = 'none';
            document.getElementById('add-product').style.display = 'none';

            // মেনু থেকে অ্যাক্টিভ ক্লাস রিমুভ করা
            document.getElementById('menu-orders').classList.remove('active');
            document.getElementById('menu-products').classList.remove('active');

            // সিলেক্ট করা সেকশনটি চালু করা
            if (sectionId === 'orders') {
                document.getElementById('orders-section').style.display = 'block';
                document.getElementById('menu-orders').classList.add('active');
                loadOrders(); // অর্ডার রিফ্রেশ করা
            } else if (sectionId === 'products') {
                document.getElementById('add-product').style.display = 'block';
                document.getElementById('menu-products').classList.add('active');
            }
        }

        // ক্যাটাগরি অনুযায়ী সাইজ অপশন শো/হাইড করার ফাংশন
        function toggleSizeOption() {
            const category = document.getElementById('productCategory').value;
            const sizeGroup = document.getElementById('sizeGroup');
            
            if (category === 'Fashion') {
                sizeGroup.style.display = 'block';
            } else {
                sizeGroup.style.display = 'none';
                document.querySelectorAll('input[name="sizes"]').forEach(cb => cb.checked = false);
            }
        }

        // ফর্ম সাবমিট হ্যান্ডলার (প্রোডাক্ট সেভ করার জন্য)
        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const title = document.getElementById('title').value;
            const category = document.getElementById('productCategory').value;
            const price = document.getElementById('price').value;
            const image = document.getElementById('image').value;
            const desc = document.getElementById('desc').value;

            const selectedSizes = [];
            if (category === 'Fashion') {
                document.querySelectorAll('input[name="sizes"]:checked').forEach(cb => {
                    selectedSizes.push(cb.value);
                });
            }

            try {
                const response = await fetch('/api/products', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        title, 
                        category, 
                        sizes: selectedSizes, 
                        price, 
                        image, 
                        desc
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('প্রোডাক্ট সফলভাবে জমা হয়েছে!');
                    document.getElementById('productForm').reset();
                    toggleSizeOption();
                } else {
                    alert('প্রোডাক্ট যোগ করতে সমস্যা হয়েছে: ' + data.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('সার্ভারে সমস্যা হয়েছে!');
            }
        });

        // অর্ডার ডাটা সার্ভার থেকে এনে ড্যাশবোর্ডে দেখানোর ফাংশন
        async function loadOrders() {
            try {
                const response = await fetch('/api/orders');
                const orders = await response.json();
                
                const tableBody = document.getElementById('orderTableBody');
                tableBody.innerHTML = '';

                if (orders.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="9" style="text-align: center; color: #777;">কোনো নতুন অর্ডার নেই</td></tr>`;
                    return;
                }

                orders.forEach((order, index) => {
    const row = `
        <tr>
            <td>#${index + 1}</td>
            <td>${order.customerName}</td>
            <td>${order.productName || order.title || 'N/A'}</td>
            <td>${order.price} টাকা</td>
            <td><span style="background: #eef2f3; padding: 2px 6px; border-radius: 4px; font-weight: bold;">${order.size || 'N/A'}</span></td>
            <td>${order.address}</td>
            <td><strong>${order.txnId}</strong></td>
            <td>${order.phone}</td>
            <td>
                <select onchange="updateOrderStatus('${order._id}', this.value)" style="padding: 5px; border-radius: 4px; font-weight: bold; background: #fff;">
                    <option value="Pending" ${order.status === 'Pending' ? 'selected' : ''}>Pending</option>
                    <option value="Active" ${order.status === 'Active' ? 'selected' : ''}>Active</option>
                    <option value="Completed" ${order.status === 'Completed' ? 'selected' : ''}>Completed</option>
                    <option value="Cancelled" ${order.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                </select>
            </td>
        </tr>
    `;
    tableBody.innerHTML += row;
});
                                                          
            } catch (error) {
                console.error('Error loading orders:', error);
                document.getElementById('orderTableBody').innerHTML = `<tr><td colspan="9" style="text-align: center; color: red;">অর্ডার লোড করতে সমস্যা হয়েছে</td></tr>`;
            }
        }

        // বাই ডিফল্ট 'অর্ডার তালিকা' ওপেন হবে
        window.onload = function() {
            switchSection('orders');
        };
       
        async function updateOrderStatus(orderId, newStatus) {
    try {
        const response = await fetch(`/api/orders/${orderId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: newStatus })
        });
        
        const data = await response.json();
        if (response.ok) {
            alert('Order status successfully updated to ' + newStatus);
        } else {
            alert('Failed to update status: ' + (data.error || data.message));
        }
    } catch (err) {
        console.error('Error updating status:', err);
        alert('Server error while updating status!');
    }
    }
        
    </script>
</body>
    </html>
