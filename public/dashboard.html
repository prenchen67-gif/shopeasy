<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন ড্যাশবোর্ড</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; display: flex; }
        .sidebar { width: 250px; background-color: #2c3e50; color: #fff; height: 100vh; padding: 20px; box-sizing: border-box; position: fixed; }
        .sidebar h2 { color: #ff6b6b; font-size: 20px; margin-bottom: 20px; }
        .sidebar a { display: block; color: #bdc3c7; padding: 10px 0; text-decoration: none; border-bottom: 1px solid #34495e; }
        .sidebar a:hover { color: #fff; }
        .main-content { margin-left: 250px; flex: 1; padding: 30px; }
        .card { background-color: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 30px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        .btn { background-color: #27ae60; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; }
        .btn:hover { background-color: #219150; }
        .checkbox-group { display: flex; gap: 15px; margin-top: 5px; }
        .checkbox-group label { font-weight: normal; cursor: pointer; }
        
        /* টেবিল স্টাইল (অর্ডার লিস্টের জন্য) */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f8f9fa; color: #333; }
    </style>
</head>
<body>

    <!-- সাইডবার -->
    <div class="sidebar">
        <h2>অ্যাডমিন প্যানেল</h2>
        <a href="#orders-section">অর্ডার তালিকা</a>
        <a href="#add-product">প্রোডাক্ট যোগ করুন</a>
        <a href="/admin.html">লগ আউট</a>
    </div>

    <!-- মেইন কন্টেন্ট -->
    <div class="main-content">
        
    
        <!-- ১. অর্ডার তালিকা সেকশন -->
<div class="card" id="orders-section">
    <h2>গ্রাহকদের অর্ডার তালিকা</h2>
    <table>
        <thead>
            <tr>
                <th>অর্ডার আইডি</th>
                <th>গ্রাহকের নাম</th>
                <th>প্রোডাক্ট</th>
                <th>মূল্য</th>
                <th>এড্রেস (Address)</th>
                <th>TXNID</th>
                <th>PHONE NUMBER</th>
                <th>স্ট্যাটাস</th>
            </tr>
        </thead>
        <tbody id="orderTableBody">
            <!-- Sample Data or Dynamic Data from Database -->
            <tr>
                <td>#101</td>
                <td>Md. Rahim</td>
                <td>টি-শার্ট (Size: L)</td>
                <td>৫০০ টাকা</td>
                <td>ধানমন্ডি, ঢাকা</td>
                <td><strong>BKA1234567</strong></td>
                <td>01572014498</td>
                <td><span style="color: orange; font-weight: bold;">Pending</span></td>
            </tr>
        </tbody>
    </table>
</div>
        
        
        </div>

        <!-- ২. প্রোডাক্ট যোগ করার ফর্ম সেকশন -->
        <div class="card" id="add-product">
            <h2>নতুন প্রোডাক্ট যোগ করুন</h2>
            <form id="productForm">
                
                <div class="form-group">
                    <label for="productName">প্রোডাক্টের নাম</label>
                    <input type="text" id="productName" required placeholder="যেমন: টি-শার্ট">
                </div>

                <!-- ক্যাটাগরি সিলেক্ট -->
                <div class="form-group">
                    <label for="productCategory">ক্যাটাগরি</label>
                    <select id="productCategory" required onchange="toggleSizeOption()">
                        <option value="">ক্যাটাগরি সিলেক্ট করুন</option>
                        <option value="Fashion">Fashion</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Gadgets">Gadgets</option>
                    </select>
                </div>

                <!-- ডাইনামিক সাইজ (Fashion সিলেক্ট করলেই দেখাবে) -->
                <div class="form-group" id="sizeGroup" style="display: none;">
                    <label>সাইজ সিলেক্ট করুন (Fashion Category-র জন্য)</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="sizes" value="S"> S</label>
                        <label><input type="checkbox" name="sizes" value="M"> M</label>
                        <label><input type="checkbox" name="sizes" value="L"> L</label>
                        <label><input type="checkbox" name="sizes" value="XL"> XL</label>
                        <label><input type="checkbox" name="sizes" value="XXL"> XXL</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="productPrice">মূল্য (টাকা)</label>
                    <input type="number" id="productPrice" required placeholder="যেমন: ৫০০">
                </div>

                <div class="form-group">
                    <label for="productImage">ছবি (Image URL)</label>
                    <input type="url" id="productImage" required placeholder="https://example.com/image.jpg">
                </div>

                <div class="form-group">
                    <label for="productDescription">বিবরণ</label>
                    <textarea id="productDescription" rows="4" placeholder="প্রোডাক্টের বিস্তারিত তথ্য..."></textarea>
                </div>

                <button type="submit" class="btn">প্রোডাক্ট সেভ করুন</button>
            </form>
        </div>

    </div>

    <script>
        // ক্যাটাগরি অনুযায়ী সাইজ অপশন শো/হাইড করার ফাংশন
        function toggleSizeOption() {
            const category = document.getElementById('productCategory').value;
            const sizeGroup = document.getElementById('sizeGroup');
            
            if (category === 'Fashion') {
                sizeGroup.style.display = 'block';
            } else {
                sizeGroup.style.display = 'none';
                document.querySelectorAll('input[name="sizes"]').forEach(cb => cb.checked = false);
            }
        }

        // ফর্ম সাবমিট হ্যান্ডলার (প্রোডাক্ট সেভ করার জন্য)
        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('productName').value;
            const category = document.getElementById('productCategory').value;
            const price = document.getElementById('productPrice').value;
            const image = document.getElementById('productImage').value;
            const description = document.getElementById('productDescription').value;

            const selectedSizes = [];
            if (category === 'Fashion') {
                document.querySelectorAll('input[name="sizes"]:checked').forEach(cb => {
                    selectedSizes.push(cb.value);
                });
            }

            try {
                const response = await fetch('/api/products', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        name, 
                        category, 
                        sizes: selectedSizes, 
                        price, 
                        image, 
                        description 
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('প্রোডাক্ট সফলভাবে জমা হয়েছে!');
                    document.getElementById('productForm').reset();
                    toggleSizeOption();
                } else {
                    alert('প্রোডাক্ট যোগ করতে সমস্যা হয়েছে: ' + data.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('সার্ভারে সমস্যা হয়েছে!');
            }
        });
    </script>
</body>
</html>
